:17px;margin:20px 0 8px}p{color:var(--muted);margin:0 0 12px}.list{color:var(--muted);padding-left:20px;margin:0}.list li{padding:4px 0}.aside h3{margin:0 0 12px}.row{padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{display:block;color:var(--muted);font-size:11px}.row strong{color:var(--navy);font-size:14px}.notice{background:#fff7eb;border-left:4px solid var(--orange);padding:13px;border-radius:5px;color:#79552a;font-size:13px}.docs .doc{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:12px 0;font-size:13px;color:var(--muted)}.docs .doc:last-child{border:0}.docs a{color:var(--blue);font-weight:800}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{height:100px;border-radius:9px;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#1769aa,#168c83)}.photo:nth-child(2){background:linear-gradient(135deg,#b8793c,#1769aa)}.photo:nth-child(3){background:linear-gradient(135deg,#785ca6,#168c83)}.back{display:inline-block;background:white;border:1px solid var(--line);border-radius:8px;padding:9px 13px;color:var(--blue);font-size:13px;font-weight:800;margin-bottom:16px}footer{background:#0b2034;color:#bac9d5;padding:25px 4%;font-size:13px}
