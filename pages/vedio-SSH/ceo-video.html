<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        font-family: Arial, sans-serif;
    }

    .video-frame {
        width: 473px;
        height: 546px;
        max-width: 92%;
        aspect-ratio: 16 / 9;
        background: #000;
        border: 4px solid #fff;
        border-radius: 18px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 15px 50px rgba(0,0,0,.6);
    }

    /* Opening screen */
    .video-cover {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        /* background:
            linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.65)),
            url("https://images.unsplash.com/photo-1492724441997-5dc865305da7?auto=format&fit=crop&w=1600&q=80")
            center / cover; */
        z-index: 2;
        transition: .4s ease;
    }

    .play-button {
        width: 90px;
        height: 90px;
        border: none;
        border-radius: 50%;
        background: white;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 8px 30px rgba(0,0,0,.5);
        transition: transform .25s, background .25s;
    }

    .play-button:hover {
        transform: scale(1.12);
        background: #f1f1f1;
    }

    .play-icon {
        width: 0;
        height: 0;
        border-top: 15px solid transparent;
        border-bottom: 15px solid transparent;
        border-left: 22px solid #111;
        margin-left: 6px;
    }

    /* Video */
    video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .hidden {
        opacity: 0;
        pointer-events: none;
    }

    img{
        width:88px; height:88px; position: absolute;    top: 9px;left: 3px;
    }

    @media (max-width: 600px) {
        .video-frame {
            border-width: 2px;
            border-radius: 10px;
        }

        .play-button {
            width: 70px;
            height: 70px;
        }
    }
</style>
<body>
    
<div class="container">
    <!-- VIDEO -->
    <div class="video-frame" id="videoFrame">
                    <img  src="SSH.png"   />

        <video id="video" class="set-video" controls>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support video.
        </video>
        <button class="back-btn" onclick="hideVideo()">
            ← Back
        </button>
    </div>
</div>

<script>

function showVideo() {

    // Hide button
    document.querySelector(".video-btn").style.display = "none";

    // Show video
    document.getElementById("videoFrame").style.display = "block";

    // Start video
    document.getElementById("video").play();
}


function hideVideo() {

    const video = document.getElementById("video");

    // Stop video
    video.pause();
    video.currentTime = 0;

    // Hide video
    document.getElementById("videoFrame").style.display = "none";

    // Show button
    document.querySelector(".video-btn").style.display = "inline-block";
}

</script>


</body>
</html>
